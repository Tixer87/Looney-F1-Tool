[pytest]
python_files=test_*.py
python_classes=Test*
python_functions=test_*
testpaths=tests
addopts=
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --maxfail=3
    --durations=10
markers=
    slow: marks tests as slow
    integration: marks tests as integration tests
    golden: marks tests as golden fixture regression tests
    parametrize: marks parametrized tests

[coverage:run]
source=mapping,core,export
omit=
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */test_*.py

[coverage:report]
precision=2
skip_covered=False
show_missing=True
exclude_lines=
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory=htmlcov