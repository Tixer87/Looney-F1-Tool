[pytest]
# Pytest configuration for Phase C++ H2 - Zero-Unknown Gatekeepers

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --maxfail=3
    # Performance
    --durations=10

# Coverage options (run separately: pytest --cov)
# Coverage target: 92% for export/ + mapping/
# Note: Golden fixture tests don't require coverage (use -m "not golden")

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    golden: marks tests as golden fixture regression tests (no coverage required)
    parametrize: marks parametrized tests

# Coverage settings
[coverage:run]
source = mapping,core,export
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */test_*.py

[coverage:report]
precision = 2
skip_covered = False
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
